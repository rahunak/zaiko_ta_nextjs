<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marmalade — Character that stays with you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #dda2ab;
      --text: #3d2222;
      --text-muted: #6d4444;
      --btn-fill: #2f1a1a;
      --btn-text: #f3e3e3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 2.1rem 3.4rem 1.8rem;
      background: var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 500;
      font-size: 1.18rem;
      color: var(--text);
      text-decoration: none;
    }
    .logo-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      font-family: 'DM Serif Display', serif;
      font-size: 1.45rem;
      font-weight: 400;
      line-height: 1;
      color: var(--text);
    }
    .logo sup {
      font-size: 0.55rem;
      vertical-align: super;
      margin-left: 0.05rem;
    }
    nav {
      display: flex;
      gap: 2.6rem;
      font-size: 0.78rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text);
    }
    nav a {
      color: inherit;
      text-decoration: none;
      opacity: 0.92;
      transition: opacity 0.2s;
    }
    nav a:hover { opacity: 1; }
    .menu {
      width: 34px;
      height: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .menu span {
      display: block;
      height: 2px;
      background: var(--text);
      border-radius: 1px;
    }
    main {
      display: flex;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .content {
      max-width: 470px;
      padding-bottom: 1vh;
      margin-top: -5vh;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(3.2rem, 5.6vw, 5.4rem);
      line-height: 1.04;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 1.55rem;
      letter-spacing: -0.01em;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      margin-right: 0.35rem;
    }
    p.lead {
      font-size: 1rem;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 390px;
      margin-bottom: 2.5rem;
      letter-spacing: 0.002em;
    }
    .actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.9rem 1.55rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      background: var(--btn-fill);
      color: var(--btn-text);
      padding-left: 1.5rem;
      padding-right: 1.3rem;
    }
    .btn-primary svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      margin-left: 0.1rem;
    }
    .btn-outline {
      border: 1.5px solid rgba(61,34,34,0.32);
      color: var(--text);
      padding: 0.84rem 1.45rem;
    }
    .character-wrap {
      position: absolute;
      right: 0;
      bottom: 0;
      height: 100%;
      width: 56vw;
      min-width: 620px;
      z-index: 0;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 0.78rem;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }
    @media (max-width: 900px) {
      .hero { padding: 1.5rem; }
      nav { display: none; }
      .character-wrap { width: 70vw; min-width: auto; right: -18vw; }
      .content { margin-top: 0; }
    }
    .character-stage {
      position: relative;
      height: 91vh;
      max-height: 92vh;
      aspect-ratio: 680 / 664;
      transform: translate3d(calc(1vw + var(--px, 0px)), var(--py, 0px), 0);
      will-change: transform;
    }
    .character-stage canvas,
    .character-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .character-stage.gl img { visibility: hidden; }
    .content { transform: translate3d(var(--tx, 0px), var(--ty, 0px), 0); will-change: transform; }
    html.embed header, html.embed nav, html.embed .content, html.embed footer, html.embed .menu { display: none !important; }
    @media (max-width: 900px) {
      main { align-items: flex-start; padding-top: 6vh; }
      .character-wrap { left: 0; right: 0; width: 100%; min-width: 0; justify-content: center; }
      .character-stage { height: min(52vh, 92vw); transform: translate3d(calc(8vw + var(--px, 0px)), var(--py, 0px), 0); }
    }
  </style>
  <script>
    if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
  </script>
</head>
<body>
  <section class="hero">
    
    
    <div class="character-wrap">
      <div class="character-stage character"><img alt="Cozy 3D character"></div>
    </div>

      void main(){ vP = (a * 0.5 + 0.5) * vec2(${W}.0, ${H}.0); vP.y = ${H}.0 - vP.y; gl_Position = vec4(a, 0.0, 1.0); }`;
    const fs = `precision highp float;
      varying vec2 vP;
      uniform sampler2D uBase, uMaps, uIris;
      uniform vec2 uOff, uLook, uPivot;
      uniform float uTilt, uBreath, uBlink, uSquint, uBlush;
      uniform vec2 uEyeN[2], uEyeR[2], uSpr[2];
      uniform vec4 uBox[2];
      uniform vec3 uSkin[2];
      const vec2 S = vec2(${W}.0, ${H}.0);
      const vec2 A = vec2(${AW}.0, ${AH}.0);

      float headW(vec2 p){ vec2 d = (p - vec2(262.0, 190.0)) / vec2(250.0, 205.0); return 1.0 - smoothstep(0.55, 1.15, length(d)); }
      vec2 rot(vec2 p, float a){ vec2 d = p - uPivot; float c = cos(a), s = sin(a); return uPivot + vec2(c*d.x - s*d.y, s*d.x + c*d.y); }

      void main(){
        vec2 p = vP;
        vec2 bc = vec2(300.0, S.y);
        p = bc + (p - bc) / (1.0 + uBreath);
        vec2 q = p;
        for (int i = 0; i < 4; i++) {
          float d = texture2D(uMaps, q / S).r;
          float hw = headW(q);
          q = mix(p, rot(p, -uTilt), hw) - d * uOff;
        }
        q.y = min(q.y, S.y - 1.0);
        vec4 base = texture2D(uBase, q / S);
        vec4 m = texture2D(uMaps, q / S);
        vec3 col = base.rgb;
        float a = base.a;
        if (q.x < 0.0 || q.x > S.x || q.y < 0.0) a = 0.0;
        a *= smoothstep(0.0, 70.0, q.x);

        float em = m.g;
        if (em > 0.003) {
          int k = m.b > 0.75 ? 1 : 0;
          vec2 n = k == 1 ? uEyeN[1] : uEyeN[0];
          vec2 r = k == 1 ? uEyeR[1] : uEyeR[0];
          vec2 sp = k == 1 ? uSpr[1] : uSpr[0];
          vec4 b = k == 1 ? uBox[1] : uBox[0];
          vec3 skin = k == 1 ? uSkin[1] : uSkin[0];
          vec2 s = q - (n + uLook * r) + sp;
          vec4 iris = vec4(0.0);
          if (abs(s.x - sp.x) < 15.5 && s.y > 0.5 && s.y < A.y - 0.5) iris = texture2D(uIris, s / A);
          vec3 eye = mix(col, iris.rgb, iris.a) * m.a;
          float cx = (b.x + b.z) * 0.5, hwid = (b.z - b.x) * 0.5, h = b.w - b.y;
          float nx = clamp((q.x - cx) / hwid, -1.0, 1.0);
          float top = b.y - 1.5 + h * 0.42 * nx * nx;
          float close = max(uBlink, uSquint * 0.38);
          float lidY = mix(top, b.w + 2.0, close);
          float lid = smoothstep(lidY + 0.8, lidY - 0.8, q.y);
          float lash = (1.0 - smoothstep(0.0, 1.6, abs(q.y - lidY))) * smoothstep(0.02, 0.15, close);
          eye = mix(eye, skin * (0.97 - 0.06 * smoothstep(top, lidY, q.y)), lid);
          eye = mix(eye, vec3(0.24, 0.14, 0.12), lash * 0.9);
          col = mix(col, eye, em);
        }
        float bl = exp(-dot((q - vec2(182.0, 268.0)) / vec2(26.0, 16.0), (q - vec2(182.0, 268.0)) / vec2(26.0, 16.0)))
                 + exp(-dot((q - vec2(305.0, 246.0)) / vec2(30.0, 18.0), (q - vec2(305.0, 246.0)) / vec2(30.0, 18.0)));
        col = mix(col, vec3(0.93, 0.50, 0.55), clamp(bl, 0.0, 1.0) * uBlush * 0.42);
        gl_FragColor = vec4(col * a, a);
      }`;

    function sh(type, src) {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = {};
    ['uBase', 'uMaps', 'uIris', 'uOff', 'uLook', 'uPivot', 'uTilt', 'uBreath', 'uBlink', 'uSquint', 'uBlush',
     'uEyeN', 'uEyeR', 'uSpr', 'uBox', 'uSkin'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

    const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    function tex(img, unit) {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const amp = reduced ? 0.35 : 1;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const ptr = { x: 0, y: 0, active: false, last: 0 };
    const target = { hx: 0, hy: 0, lx: 0, ly: 0, near: 0 };
    const cur = { hx: 0, hy: 0, lx: 0, ly: 0, near: 0, blink: 0, pulse: 0 };
    let idleGaze = { x: 0, y: 0, next: 0 };
    let blinkAt = performance.now() + 1800, blinkStart = -1, doubleBlink = false;

    function onMove(x, y) {
      const prevLx = target.lx, prevLy = target.ly;
      ptr.x = x; ptr.y = y; ptr.active = true; ptr.last = performance.now();
      update();
      if (Math.hypot(target.lx - prevLx, target.ly - prevLy) > 0.9 && blinkStart < 0) blinkAt = performance.now();
    }
    addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
    addEventListener('message', e => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === 'pointer') onMove(e.data.x, e.data.y);
      if (e.data.type === 'down') { onMove(e.data.x, e.data.y); cur.pulse = 1; blinkAt = performance.now(); doubleBlink = true; }
    });
    addEventListener('pointerdown', e => { onMove(e.clientX, e.clientY); cur.pulse = 1; blinkAt = performance.now(); doubleBlink = true; });
    document.addEventListener('pointerleave', () => { ptr.active = false; });
    addEventListener('blur', () => { ptr.active = false; });

    function faceScreen() {
      const r = canvas.getBoundingClientRect();
      return [r.left + FACE[0] / W * r.width, r.top + FACE[1] / H * r.height, r.width];
    }
    function update() {
      const [fx, fy, cw] = faceScreen();
      const dx = ptr.x - fx, dy = ptr.y - fy;
      const nx = clamp(dx / Math.max(innerWidth * 0.55, 1), -1, 1);
      const ny = clamp(dy / Math.max(innerHeight * 0.55, 1), -1, 1);
      target.hx = nx; target.hy = ny;
      const dist = Math.hypot(dx, dy) || 1;
      const reach = clamp(dist / (cw * 0.35), 0, 1);
      target.lx = clamp(dx / dist * reach * 1.15, -1, 1);
      target.ly = clamp(dy / dist * reach * 1.15, -1, 1);
      target.near = 1 - clamp((dist - cw * 0.12) / (cw * 0.35), 0, 1);
    }

    function setUniforms() {
      gl.uniform1i(U.uBase, 0); gl.uniform1i(U.uMaps, 1); gl.uniform1i(U.uIris, 2);
      gl.uniform2fv(U.uPivot, PIVOT);
      gl.uniform2fv(U.uEyeN, META.flatMap(e => e.neutral));
      gl.uniform2fv(U.uEyeR, META.flatMap(e => e.range));
      gl.uniform2fv(U.uSpr, META.flatMap(e => e.sprite));
      gl.uniform4fv(U.uBox, META.flatMap(e => e.box));
      gl.uniform3fv(U.uSkin, META.flatMap(e => e.skin));
    }

    function resize() {
      const r = stage.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(r.width * dpr);
      canvas.height = Math.round(r.height * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    let t0 = performance.now(), prev = t0;
    function frame(now) {
      const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
      const t = (now - t0) / 1000;
      const idle = !ptr.active || now - ptr.last > 4000;
      if (idle) {
        if (now > idleGaze.next) {
          idleGaze = { x: (Math.random() * 2 - 1) * 0.7, y: (Math.random() * 2 - 1) * 0.35, next: now + 1400 + Math.random() * 2200 };
          if (Math.random() < 0.35) blinkAt = now + 60;
        }
        target.lx = idleGaze.x; target.ly = idleGaze.y;
        target.hx = idleGaze.x * 0.35; target.hy = idleGaze.y * 0.3;
        target.near = 0;
      }
      const k = s => 1 - Math.exp(-s * dt);
      cur.hx += (target.hx - cur.hx) * k(3.2);
      cur.hy += (target.hy - cur.hy) * k(3.2);
      cur.lx += (target.lx - cur.lx) * k(14);
      cur.ly += (target.ly - cur.ly) * k(14);
      cur.near += (target.near - cur.near) * k(4);
      cur.pulse = Math.max(0, cur.pulse - dt * 1.4);

      if (blinkStart < 0 && now >= blinkAt) blinkStart = now;
      if (blinkStart >= 0) {
        const p = (now - blinkStart) / 170;
        cur.blink = p < 0.45 ? p / 0.45 : Math.max(0, 1 - (p - 0.45) / 0.55);
        if (p >= 1) {
          blinkStart = -1; cur.blink = 0;
          if (doubleBlink) { doubleBlink = false; blinkAt = now + 120; }
          else { blinkAt = now + 2200 + Math.random() * 3200; doubleBlink = Math.random() < 0.18; }
        }
      }
      const bounce = Math.sin(cur.pulse * Math.PI) * cur.pulse;
      const sway = Math.sin(t * 0.9) * 0.6;
      gl.uniform2f(U.uOff, (cur.hx * 15 + sway) * amp, (cur.hy * 9 - bounce * 7 + Math.sin(t * 1.6) * 0.8) * amp);
      gl.uniform1f(U.uTilt, (cur.hx * 0.055 + Math.sin(t * 0.7) * 0.006) * amp);
      gl.uniform1f(U.uBreath, (Math.sin(t * 1.6) * 0.5 + 0.5) * 0.006 * amp);
      gl.uniform2f(U.uLook, cur.lx, cur.ly);
      gl.uniform1f(U.uBlink, cur.blink);
      gl.uniform1f(U.uSquint, Math.max(cur.near, cur.pulse) * (reduced ? 0.5 : 1));
      gl.uniform1f(U.uBlush, Math.max(cur.near, cur.pulse));
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      const root = document.querySelector('.hero');
      stage.style.setProperty('--px', (cur.hx * 10 * amp).toFixed(2) + 'px');
      stage.style.setProperty('--py', (cur.hy * 5 * amp).toFixed(2) + 'px');
      root.style.setProperty('--tx', (-cur.hx * 6 * amp).toFixed(2) + 'px');
      root.style.setProperty('--ty', (-cur.hy * 4 * amp).toFixed(2) + 'px');
      requestAnimationFrame(frame);
    }

    Promise.all([load(IMG.base), load(IMG.maps), load(IMG.iris)]).then(([b, m, i]) => {
      tex(b, 0); tex(m, 1); tex(i, 2);
      setUniforms();
      stage.appendChild(canvas);
      stage.classList.add('gl');
      resize();
      new ResizeObserver(resize).observe(stage);
      ptr.x = innerWidth * 0.3; ptr.y = innerHeight * 0.4;
      requestAnimationFrame(frame);
    }).catch(err => console.warn('Character animation disabled:', err));
  })();
  </script>
</body>
</html>
